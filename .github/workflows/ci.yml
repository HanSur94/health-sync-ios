name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the project
        run: |
          brew install xcodegen
          TEAM_ID= xcodegen generate

      - name: Run the unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in devices.items()
                     if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')
          echo "simulator: $UDID"
          xcodebuild test -project HealthSync.xcodeproj -scheme HealthSync \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Build the Release configuration
        run: |
          xcodebuild -project HealthSync.xcodeproj -scheme HealthSync -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Check the README against the STE limits
        run: python3 tools/check-ste.py
