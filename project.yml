name: HealthSync
options:
  bundleIdPrefix: de.hannessuhr
  deploymentTarget:
    iOS: "17.0"
targets:
  HealthSync:
    type: application
    platform: iOS
    sources: [HealthSync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hannessuhr.healthsync
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${TEAM_ID}          # TEAM_ID=XXXXXXXXXX xcodegen generate
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
